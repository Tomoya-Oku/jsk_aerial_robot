# フレームと座標系
world_frame: "world"
mocap_frame: "dracomancer_base"

# マッピング（位置→位置、姿勢→姿勢、速度は微分）
use_position: true
use_yaw: true
position_gain: 1.0        # m→m
yaw_gain: 1.0             # rad→rad
max_vel: 0.8              # m/s
max_yaw_rate: 0.8         # rad/s

# フィルタ/安全
pose_lowpass_cutoff_hz: 5.0
lost_timeout_sec: 0.2     # モーキャプ欠落時は出力停止
soft_estop_on_lost: true
publish_rate_hz: 100