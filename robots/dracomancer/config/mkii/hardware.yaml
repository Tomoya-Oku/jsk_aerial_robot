# Fill from the real wiring, CAD-zero calibration, and measured joint Nm/A.
# Empty configuration is intentionally read-only and never arms a motor.
calibrated: false
actuators: {}
# Physical DYNAMIXEL IDs in CAD joint order; these are not Spinal scan indexes.
servo_ids:
  right_joint_1: 1
  right_joint_2: 2
  right_joint_3: 3
  right_joint_4: 4
  right_joint_5: 5
  right_joint_6: 6
  right_joint_7: 7
  left_joint_1: 11
  left_joint_2: 12
  left_joint_3: 13
  left_joint_4: 14
  left_joint_5: 15
  left_joint_6: 16
  left_joint_7: 17
# Example schema (calibration/limits must come from measurements):
# actuators:
#   right_joint_1:
#     index: <Spinal scan index, 0..6 on this arm; confirm via get_board_info>
#     id: <optional override; defaults to servo_ids for this joint>
#     direction: <1 or -1>
#     zero_tick: <servo/states.angle at CAD q=0>
#     radians_per_tick: <joint rad/count; 2*pi/4096 for direct shaft drive>
#     joint_nm_per_amp: <measured joint Nm/A>
#     max_current_amp: <approved current cap in A>
#     max_torque_nm: <approved joint torque cap in Nm>
