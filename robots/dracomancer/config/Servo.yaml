servo_controller:
  state_sub_topic: /dracomancer/servo/states

  joints:
    # Dracomancer Mk-II uses XM430-W350-R for all seven joints.
    angle_sgn: 1
    angle_scale: 0.00153398 # 2 * pi / 4096
    zero_point_offset: 2048
    # Nominal 12 V conversion: 1.783 Nm/A * 0.00269 A/current-unit.
    # Per-joint human-safe limits still require Mk-II bench calibration.
    torque_scale: 0.00479627

    filter_flag: true
    sample_freq: 50.0
    cutoff_freq: 10.0

    controller1:
      id: 0
      name: shoulder_abduction_adduction_joint
    controller2:
      id: 1
      name: shoulder_flexion_extension_joint
    controller3:
      id: 2
      name: upper_arm_external_internal_rotation_joint
    controller4:
      id: 3
      name: elbow_flexion_extension_joint
    controller5:
      id: 4
      name: wrist_supination_joint
    controller6:
      id: 5
      name: wrist_flexion_extension_joint
    controller7:
      id: 6
      name: wrist_abduction_adduction_joint
