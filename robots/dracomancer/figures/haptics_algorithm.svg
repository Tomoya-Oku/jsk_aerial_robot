<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-labelledby="title desc">
  <title id="title">Haptics Launch Algorithm</title>
  <desc id="desc">System diagram for dracomancer haptics.launch and control_haptic_feedback.py.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 21px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .section-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2.1; }
      .box-blue { fill: #eaf3fb; stroke: #1f4e79; stroke-width: 2.4; }
      .box-green { fill: #edf7f0; stroke: #2f6f4e; stroke-width: 2.4; }
      .box-amber { fill: #fff7e6; stroke: #9a6a00; stroke-width: 2.4; }
      .box-red { fill: #fff0f0; stroke: #9f2d2d; stroke-width: 2.4; }
      .box-purple { fill: #f2ecfb; stroke: #6d4aa2; stroke-width: 2.4; }
      .box-gray { fill: #f3f4f6; stroke: #64748b; stroke-width: 2.1; }
      .label { font: 700 20px Arial, Helvetica, sans-serif; fill: #111827; }
      .text { font: 400 17px Arial, Helvetica, sans-serif; fill: #374151; }
      .topic { font: 400 16px Consolas, Menlo, monospace; fill: #334155; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .note { font: 700 15px Arial, Helvetica, sans-serif; fill: #b42318; }
      .arrow { fill: none; stroke: #1f4e79; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-gray { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow-gray); stroke-dasharray: 8 7; }
      .arrow-red { fill: none; stroke: #b42318; stroke-width: 3; marker-end: url(#arrow-red); }
      .thin { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrow-gray); }
      .math { font: 400 16px Consolas, Menlo, monospace; fill: #374151; }
    </style>
  </defs>

  <rect class="bg" width="1700" height="1120"/>
  <text class="title" x="70" y="68">Haptics Launch Algorithm</text>
  <text class="subtitle" x="70" y="105">Current dracomancer haptics.launch flow: monitor by default, hardware haptics only when explicitly enabled</text>

  <rect class="section" x="55" y="145" width="390" height="825" rx="14"/>
  <text class="section-title" x="85" y="185">Inputs</text>

  <rect class="box-blue" x="85" y="225" width="310" height="82" rx="10"/>
  <text class="label" x="115" y="255">Device joint state</text>
  <text class="topic" x="115" y="281">/dracomancer/joint_states</text>
  <text class="small" x="115" y="299">joint angle + estimated velocity</text>

  <rect class="box-blue" x="85" y="350" width="310" height="82" rx="10"/>
  <text class="label" x="115" y="380">Shape suppression error</text>
  <text class="topic" x="115" y="406">/dracomancer/shape_control_error</text>
  <text class="small" x="115" y="424">q_des - q_tar from safety gate</text>

  <rect class="box-blue" x="85" y="475" width="310" height="82" rx="10"/>
  <text class="label" x="115" y="505">Teleoperation mode</text>
  <text class="topic" x="115" y="531">/dracomancer/teleop_mode</text>
  <text class="small" x="115" y="549">startup / teleoperation</text>

  <rect class="box-gray" x="85" y="600" width="310" height="188" rx="10"/>
  <text class="label" x="115" y="630">Launch parameters</text>
  <text class="topic" x="115" y="657">rate = 100 Hz</text>
  <text class="topic" x="115" y="681">enable_haptic_torque_onoff = false</text>
  <text class="topic" x="115" y="705">enable_haptic_position_command = false</text>
  <text class="topic" x="115" y="729">position output: pulse</text>
  <text class="topic" x="115" y="753">pulse_rate = 25 Hz, duty = 0.4</text>
  <text class="topic" x="115" y="777">max_offset = 0.03 rad</text>

  <rect class="box-red" x="85" y="835" width="310" height="92" rx="10"/>
  <text class="label" x="115" y="864">Fail-safe hooks</text>
  <text class="small" x="115" y="890">On start / shutdown:</text>
  <text class="topic" x="115" y="914">servo IDs 0..6 torque OFF x3</text>

  <rect class="section" x="495" y="145" width="455" height="825" rx="14"/>
  <text class="section-title" x="525" y="185">Core 100 Hz Loop</text>

  <rect class="box-green" x="540" y="225" width="365" height="95" rx="10"/>
  <text class="label" x="570" y="255">Read latest messages</text>
  <text class="small" x="570" y="282">Check freshness of shape error and joint state</text>
  <text class="topic" x="570" y="305">shape_error_timeout, joint_state_timeout</text>

  <rect class="box-green" x="540" y="365" width="365" height="130" rx="10"/>
  <text class="label" x="570" y="395">Compute haptic torque</text>
  <text class="math" x="570" y="425">tau_device = B^T K_q e_q - D_h theta_dot</text>
  <text class="small" x="570" y="455">Only active in teleoperation with fresh shape error</text>
  <text class="small" x="570" y="480">Otherwise tau_device is zero</text>

  <rect class="box-green" x="540" y="540" width="365" height="95" rx="10"/>
  <text class="label" x="570" y="570">Clamp and publish monitor</text>
  <text class="topic" x="570" y="597">/dracomancer/haptic_torque</text>
  <text class="small" x="570" y="620">Always published for analysis / rqt</text>

  <rect class="box-amber" x="540" y="685" width="365" height="108" rx="10"/>
  <text class="label" x="570" y="715">Hardware output switch</text>
  <text class="small" x="570" y="742">Default: all hardware outputs disabled</text>
  <text class="small" x="570" y="767">Enable one path explicitly from launch args</text>

  <path class="arrow" d="M 395 266 L 540 266"/>
  <path class="arrow" d="M 395 391 L 540 391"/>
  <path class="arrow" d="M 395 516 L 540 516"/>
  <path class="arrow" d="M 722 320 L 722 365"/>
  <path class="arrow" d="M 722 495 L 722 540"/>
  <path class="arrow" d="M 722 635 L 722 685"/>
  <path class="arrow-red" d="M 395 881 C 455 881 475 838 540 795"/>

  <rect class="section" x="1000" y="145" width="645" height="825" rx="14"/>
  <text class="section-title" x="1030" y="185">Output Paths</text>

  <rect class="box-gray" x="1045" y="225" width="540" height="105" rx="10"/>
  <text class="label" x="1075" y="255">Default path: monitor only</text>
  <text class="small" x="1075" y="282">No ServoTorqueCmd and no ServoControlCmd are sent</text>
  <text class="topic" x="1075" y="306">enable_haptic_torque_onoff = false</text>

  <rect class="box-purple" x="1045" y="372" width="540" height="238" rx="10"/>
  <text class="label" x="1075" y="402">Position-offset pseudo haptics</text>
  <text class="topic" x="1075" y="429">enable_haptic_position_command = true</text>
  <text class="small" x="1075" y="457">Gate: teleoperation + fresh shape error + fresh joint state</text>
  <text class="small" x="1075" y="482">Active if |tau_device| >= haptic_position_torque_threshold</text>
  <text class="math" x="1075" y="512">q_goal = q_anchor + sign * clamp(tau * offset_per_nm)</text>
  <text class="small" x="1075" y="542">pulse mode: 25 Hz, 40% duty by default</text>
  <text class="topic" x="1075" y="570">/dracomancer/servo/target_states</text>
  <text class="topic" x="1075" y="594">/dracomancer/servo/torque_enable</text>

  <rect class="box-amber" x="1045" y="650" width="540" height="130" rx="10"/>
  <text class="label" x="1075" y="680">Torque ON/OFF warning</text>
  <text class="topic" x="1075" y="707">enable_haptic_torque_onoff = true</text>
  <text class="small" x="1075" y="735">Servo ON when |tau_device| >= haptic_torque_on_threshold</text>
  <text class="topic" x="1075" y="760">/dracomancer/servo/torque_enable</text>

  <rect class="box-blue" x="1045" y="820" width="540" height="105" rx="10"/>
  <text class="label" x="1075" y="850">Compatible-servo current path</text>
  <text class="topic" x="1075" y="877">enable_haptic_current_command = true</text>
  <text class="small" x="1075" y="902">Scales tau_device to current-like command</text>
  <text class="topic" x="1340" y="902">/servo/target_current</text>

  <path class="arrow-gray" d="M 905 740 L 1045 277"/>
  <path class="arrow" d="M 905 740 C 950 740 970 491 1045 491"/>
  <path class="arrow" d="M 905 740 L 1045 715"/>
  <path class="arrow-gray" d="M 905 740 C 970 740 960 870 1045 870"/>

  <rect class="section" x="55" y="1005" width="1590" height="72" rx="14"/>
  <text class="section-title" x="85" y="1038">Important behavior</text>
  <text class="text" x="310" y="1038">haptics.launch is safe by default: it computes and publishes haptic_torque, but does not lock servos unless a hardware output path is explicitly enabled.</text>
  <text class="text" x="310" y="1063">When hardware output is enabled, stale inputs or mode exit drive torque_enable OFF, and node start/shutdown sends all target servo torques OFF.</text>
</svg>
