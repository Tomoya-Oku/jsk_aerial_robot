<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dracomancer Teleoperation System Overview</title>
  <desc id="desc">Paper-ready overview diagram of the Dracomancer exoskeleton teleoperation system for DRAGON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .section { fill: #f8fafc; stroke: #1f2937; stroke-width: 2.2; }
      .section-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .box-blue { fill: #eaf3fb; stroke: #1f4e79; stroke-width: 2.4; }
      .box-green { fill: #edf7f0; stroke: #2f6f4e; stroke-width: 2.4; }
      .box-amber { fill: #fff7e6; stroke: #9a6a00; stroke-width: 2.4; }
      .box-red { fill: #fff0f0; stroke: #9f2d2d; stroke-width: 2.4; }
      .label { font: 700 21px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 400 17px Arial, Helvetica, sans-serif; fill: #374151; }
      .mono { font: 400 16px Consolas, Menlo, monospace; fill: #334155; }
      .arrow { fill: none; stroke: #1f4e79; stroke-width: 3.2; marker-end: url(#arrow); }
      .arrow-gray { fill: none; stroke: #6b7280; stroke-width: 2.6; marker-end: url(#arrow-gray); stroke-dasharray: 8 7; }
      .caption { font: 400 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="80" y="74">Dracomancer Teleoperation System Overview</text>
  <text class="subtitle" x="80" y="112">Upper-limb exoskeleton interface for intuitive teleoperation of a multi-link aerial robot</text>

  <rect class="section" x="70" y="165" width="315" height="560" rx="18"/>
  <text class="section-title" x="105" y="210">Human Operator</text>
  <rect class="box" x="105" y="255" width="245" height="96" rx="12"/>
  <text class="label" x="132" y="292">Upper-limb motion</text>
  <text class="small" x="132" y="324">Seven joint posture</text>
  <rect class="box" x="105" y="392" width="245" height="96" rx="12"/>
  <text class="label" x="132" y="429">Joystick input</text>
  <text class="small" x="132" y="461">Wide-area motion intent</text>
  <rect class="box" x="105" y="529" width="245" height="96" rx="12"/>
  <text class="label" x="132" y="566">Body heading</text>
  <text class="small" x="132" y="598">Operator-relative frame</text>

  <rect class="section" x="455" y="165" width="365" height="560" rx="18"/>
  <text class="section-title" x="490" y="210">Dracomancer Device</text>
  <rect class="box-blue" x="500" y="252" width="275" height="84" rx="12"/>
  <text class="label" x="530" y="286">DYNAMIXEL servos</text>
  <text class="small" x="530" y="316">IDs 0-6, joint sensing</text>
  <rect class="box-blue" x="500" y="374" width="275" height="84" rx="12"/>
  <text class="label" x="530" y="408">M5Stack joystick</text>
  <text class="small" x="530" y="438">Raw axis values</text>
  <rect class="box-blue" x="500" y="496" width="275" height="84" rx="12"/>
  <text class="label" x="530" y="530">Back-mounted IMU</text>
  <text class="small" x="530" y="560">Quaternion orientation</text>
  <rect class="box-blue" x="500" y="618" width="275" height="62" rx="12"/>
  <text class="label" x="530" y="655">Spinal / Khadas VIM4</text>

  <rect class="section" x="890" y="165" width="340" height="560" rx="18"/>
  <text class="section-title" x="925" y="210">ROS Teleoperation</text>
  <rect class="box-green" x="935" y="245" width="250" height="78" rx="12"/>
  <text class="label" x="965" y="278">startup mode</text>
  <text class="small" x="965" y="306">Hold takeoff posture</text>
  <rect class="box-green" x="935" y="352" width="250" height="78" rx="12"/>
  <text class="label" x="965" y="385">teleoperation</text>
  <text class="small" x="965" y="413">Arm-to-robot mapping</text>
  <rect class="box-green" x="935" y="459" width="250" height="78" rx="12"/>
  <text class="label" x="965" y="492">optional motion</text>
  <text class="small" x="965" y="520">Position/attitude nodes</text>
  <rect class="box-amber" x="935" y="586" width="250" height="84" rx="12"/>
  <text class="label" x="965" y="620">Shape safety</text>
  <text class="small" x="965" y="650">Feasible control radius</text>

  <rect class="section" x="1300" y="165" width="230" height="560" rx="18"/>
  <text class="section-title" x="1335" y="210">DRAGON</text>
  <rect class="box-red" x="1335" y="270" width="160" height="90" rx="12"/>
  <text class="label" x="1368" y="306">Flight</text>
  <text class="small" x="1362" y="336">/uav/nav</text>
  <rect class="box-red" x="1335" y="420" width="160" height="90" rx="12"/>
  <text class="label" x="1362" y="456">Shape</text>
  <text class="small" x="1350" y="486">/joints_ctrl</text>
  <rect class="box-red" x="1335" y="570" width="160" height="90" rx="12"/>
  <text class="label" x="1368" y="606">Robot</text>
  <text class="small" x="1356" y="636">multi-link body</text>

  <path class="arrow" d="M 350 303 C 410 303, 435 292, 500 292"/>
  <path class="arrow" d="M 350 440 C 410 440, 435 416, 500 416"/>
  <path class="arrow" d="M 350 577 C 410 577, 435 538, 500 538"/>
  <path class="arrow" d="M 775 294 C 840 294, 870 284, 935 284"/>
  <path class="arrow" d="M 775 416 C 850 416, 870 391, 935 391"/>
  <path class="arrow" d="M 775 538 C 850 538, 870 498, 935 498"/>
  <path class="arrow" d="M 1185 498 C 1235 498, 1275 315, 1335 315"/>
  <path class="arrow" d="M 1185 391 C 1240 391, 1275 465, 1335 465"/>
  <path class="arrow-gray" d="M 1335 615 C 1250 705, 1040 725, 1030 670"/>

  <text class="mono" x="403" y="286">servo states</text>
  <text class="mono" x="400" y="407">raw axes</text>
  <text class="mono" x="407" y="528">orientation</text>
  <text class="mono" x="1238" y="287">FlightNav</text>
  <text class="mono" x="1230" y="450">JointState</text>
  <text class="mono" x="1052" y="716">force / torque radius</text>

  <text class="caption" x="80" y="820">Caption: Dracomancer Teleoperation System Overview</text>
</svg>
