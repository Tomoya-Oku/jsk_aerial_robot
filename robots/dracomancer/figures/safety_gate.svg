<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dracomancer Danger Pose Avoidance Gate</title>
  <desc id="desc">Simple system diagram of Dracomancer danger pose avoidance using predicted force and torque feasible control radii.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f4e"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9f2d2d"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 40px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
      .lane-title { font: 700 22px Arial, Helvetica, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2.2; }
      .box-blue { fill: #eaf3fb; stroke: #1f4e79; stroke-width: 2.5; }
      .box-green { fill: #edf7f0; stroke: #2f6f4e; stroke-width: 2.5; }
      .box-amber { fill: #fff7e6; stroke: #9a6a00; stroke-width: 2.5; }
      .box-red { fill: #fff0f0; stroke: #9f2d2d; stroke-width: 2.5; }
      .label { font: 700 21px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 400 17px Arial, Helvetica, sans-serif; fill: #374151; }
      .mono { font: 400 16px Consolas, Menlo, monospace; fill: #334155; }
      .decision { fill: #fff7e6; stroke: #9a6a00; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #1f4e79; stroke-width: 3.2; marker-end: url(#arrow-blue); }
      .arrow-green { fill: none; stroke: #2f6f4e; stroke-width: 3.2; marker-end: url(#arrow-green); }
      .arrow-red { fill: none; stroke: #9f2d2d; stroke-width: 3.2; marker-end: url(#arrow-red); }
      .arrow-gray { fill: none; stroke: #6b7280; stroke-width: 2.6; marker-end: url(#arrow-gray); stroke-dasharray: 8 7; }
      .caption { font: 400 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>
  <text class="title" x="70" y="70">Dracomancer Danger Pose Avoidance Gate</text>
  <text class="subtitle" x="70" y="108">Candidate DRAGON shape is accepted only when predicted force and torque margins exceed thresholds</text>

  <rect class="lane" x="60" y="150" width="1480" height="190" rx="16"/>
  <text class="lane-title" x="95" y="193">1. Candidate shape generation</text>

  <rect class="box-blue" x="105" y="225" width="260" height="78" rx="10"/>
  <text class="label" x="135" y="256">Dracomancer joints</text>
  <text class="small" x="135" y="284">operator arm posture</text>

  <rect class="box" x="455" y="225" width="290" height="78" rx="10"/>
  <text class="label" x="492" y="256">control_joint_angle.py</text>
  <text class="small" x="492" y="284">mapping + step limit</text>

  <rect class="box-green" x="835" y="225" width="285" height="78" rx="10"/>
  <text class="label" x="875" y="256">Candidate JointState</text>
  <text class="mono" x="875" y="284">target DRAGON shape</text>

  <rect class="box-amber" x="1210" y="225" width="255" height="78" rx="10"/>
  <text class="label" x="1242" y="256">Gate enabled?</text>
  <text class="mono" x="1242" y="284">enable_feasibility_gate</text>

  <path class="arrow" d="M 365 264 L 455 264"/>
  <path class="arrow" d="M 745 264 L 835 264"/>
  <path class="arrow" d="M 1120 264 L 1210 264"/>

  <rect class="lane" x="60" y="385" width="1480" height="265" rx="16"/>
  <text class="lane-title" x="95" y="428">2. Prediction and threshold check</text>

  <rect class="box" x="105" y="475" width="300" height="94" rx="10"/>
  <text class="label" x="136" y="507">shape_feasibility</text>
  <text class="mono" x="136" y="535">/dragon/shape_feasibility/check_shape</text>
  <text class="small" x="136" y="559">service request: candidate shape</text>

  <rect class="box-blue" x="490" y="465" width="330" height="115" rx="10"/>
  <text class="label" x="526" y="497">DRAGON full-vectoring model</text>
  <text class="mono" x="526" y="525">prediction_mode=optimized_gimbal</text>
  <text class="small" x="526" y="553">updateRobotModel() then use</text>
  <text class="mono" x="526" y="575">gimbal-processed joint state</text>

  <rect class="box-green" x="905" y="465" width="280" height="115" rx="10"/>
  <text class="label" x="938" y="497">Predicted margins</text>
  <text class="mono" x="938" y="525">fc_f_min</text>
  <text class="mono" x="938" y="550">fc_t_min</text>
  <text class="small" x="938" y="574">force / torque radius</text>

  <polygon class="decision" points="1335,450 1490,522 1335,595 1180,522"/>
  <text class="label" x="1264" y="510">Both above</text>
  <text class="label" x="1276" y="537">thresholds?</text>

  <path class="arrow" d="M 405 522 L 490 522"/>
  <path class="arrow" d="M 820 522 L 905 522"/>
  <path class="arrow" d="M 1185 522 L 1180 522"/>

  <path class="arrow-gray" d="M 1338 303 C 1338 345, 278 345, 255 475"/>
  <text class="mono" x="610" y="372">check_shape(candidate)</text>

  <rect class="box-amber" x="880" y="688" width="320" height="96" rx="10"/>
  <text class="label" x="914" y="720">Threshold source</text>
  <text class="mono" x="914" y="748">force_radius_threshold</text>
  <text class="mono" x="914" y="771">torque_radius_threshold</text>

  <path class="arrow-gray" d="M 1040 688 C 1080 635, 1155 570, 1202 538"/>
  <text class="small" x="1215" y="632">topic value or launch fallback</text>

  <rect class="lane" x="60" y="690" width="700" height="145" rx="16"/>
  <text class="lane-title" x="95" y="732">3. Command output</text>

  <rect class="box-green" x="115" y="765" width="250" height="58" rx="10"/>
  <text class="label" x="150" y="800">Accept candidate</text>

  <rect class="box-red" x="455" y="765" width="250" height="58" rx="10"/>
  <text class="label" x="488" y="800">Hold last safe shape</text>

  <path class="arrow-green" d="M 1335 595 C 1280 745, 520 720, 365 790"/>
  <text class="mono" x="715" y="716">YES</text>

  <path class="arrow-red" d="M 1490 522 C 1525 665, 840 735, 705 790"/>
  <text class="mono" x="1420" y="650">NO / service failure</text>

  <rect class="box-blue" x="115" y="842" width="590" height="42" rx="8"/>
  <text class="mono" x="145" y="869">publish /dragon/joints_ctrl or keep previous feasible command</text>

  <path class="arrow-gray" d="M 1338 303 C 1440 352, 1485 405, 1458 455"/>
  <text class="mono" x="1415" y="362">gate OFF: bypass</text>

  <text class="caption" x="70" y="870">Caption: Safety gate for force/torque volume radius based danger pose avoidance in Dracomancer teleoperation.</text>
</svg>
