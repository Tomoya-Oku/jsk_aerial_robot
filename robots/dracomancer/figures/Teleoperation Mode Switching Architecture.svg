<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
  <title id="title">Teleoperation Mode Switching Architecture</title>
  <desc id="desc">State-machine style diagram of startup and teleoperation modes, with optional control-node launch toggles.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 42px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .state { fill: #ffffff; stroke: #1f2937; stroke-width: 2.4; }
      .startup { fill: #fff7e6; stroke: #9a6a00; }
      .teleoperation { fill: #edf7f0; stroke: #2f6f4e; }
      .optional { fill: #eaf3fb; stroke: #1f4e79; }
      .label { font: 700 27px Arial, Helvetica, sans-serif; fill: #111827; }
      .small { font: 400 19px Arial, Helvetica, sans-serif; fill: #374151; }
      .mono { font: 400 18px Consolas, Menlo, monospace; fill: #334155; }
      .arrow { fill: none; stroke: #1f4e79; stroke-width: 3.2; marker-end: url(#arrow); }
      .thin { fill: none; stroke: #64748b; stroke-width: 2.2; }
      .caption { font: 400 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="920"/>
  <text class="title" x="80" y="72">Teleoperation Mode Switching Architecture</text>
  <text class="subtitle" x="80" y="110">Runtime mode selection separates startup posture from active teleoperation; launch args enable each output path</text>

  <rect class="state startup" x="590" y="180" width="320" height="160" rx="22"/>
  <text class="label" x="688" y="230">startup</text>
  <text class="small" x="630" y="272">Hold startup posture</text>
  <text class="mono" x="625" y="305">[0, pi/2, 0, pi/2, 0, pi/2]</text>

  <rect class="state teleoperation" x="170" y="500" width="360" height="180" rx="22"/>
  <text class="label" x="245" y="552">teleoperation</text>
  <text class="small" x="220" y="596">Arm-to-DRAGON mapping</text>
  <text class="small" x="220" y="628">Shape output when hovering</text>
  <text class="mono" x="220" y="660">/dragon/joints_ctrl</text>

  <rect class="state optional" x="970" y="500" width="360" height="180" rx="22"/>
  <text class="label" x="1048" y="552">optional nav</text>
  <text class="small" x="1018" y="596">enable_position_control</text>
  <text class="small" x="1018" y="628">OFF by default</text>
  <text class="mono" x="1018" y="660">/dragon/uav/nav</text>

  <path class="arrow" d="M 640 340 C 500 390, 410 440, 350 500"/>
  <text class="mono" x="380" y="405">mode = teleoperation</text>

  <path class="arrow" d="M 860 340 C 1000 390, 1090 440, 1150 500"/>
  <text class="mono" x="965" y="405">launch toggle</text>

  <path class="arrow" d="M 530 590 C 665 540, 835 540, 970 590"/>
  <text class="mono" x="664" y="532">teleoperation + optional nav</text>

  <path class="arrow" d="M 350 500 C 410 410, 505 330, 590 270"/>
  <path class="arrow" d="M 1150 500 C 1090 410, 995 330, 910 270"/>

  <rect class="state" x="505" y="730" width="490" height="72" rx="16"/>
  <text class="small" x="540" y="760">Runtime command topic</text>
  <text class="mono" x="540" y="788">/dracomancer/teleop_mode  std_msgs/Bool</text>

  <line class="thin" x1="750" y1="730" x2="750" y2="690"/>
  <path class="arrow" d="M 750 730 C 710 690, 585 625, 530 600"/>
  <path class="arrow" d="M 750 730 C 790 690, 915 625, 970 600"/>
  <path class="arrow" d="M 750 730 C 750 610, 750 460, 750 340"/>

  <rect class="state" x="104" y="190" width="330" height="120" rx="18"/>
  <text class="label" x="152" y="235">Mode responsibility</text>
  <text class="small" x="152" y="270">startup / teleoperation</text>
  <text class="small" x="152" y="294">via String topic</text>

  <rect class="state" x="1065" y="190" width="330" height="120" rx="18"/>
  <text class="label" x="1118" y="235">Safety behavior</text>
  <text class="small" x="1118" y="270">Commands gated by hover</text>
  <text class="small" x="1118" y="294">and device readiness</text>

  <text class="caption" x="80" y="870">Caption: Teleoperation Mode Switching Architecture</text>
</svg>
